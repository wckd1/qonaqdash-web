info:
    contact: {}
    description: |-
        REST API for the QonaqDash hotel CRM modular monolith.
        **Canonical contract:** the OpenAPI 3.0 document `docs/openapi.yaml`, generated from these annotations by `make swagger` (`docs/swagger.yaml` / `swagger.json` are the intermediate Swagger 2.0 output). It lists every path, request and response model, field examples, and **per-status error `code` values** clients use for localization.
        **Narrative guide:** auth flows, FormDSL editor vs runtime behaviour, reservation-grid UX, and tenancy rules live in **`docs/integration.md`** (same repository).
        ## Error envelope
        Failed requests return `{"error":{"code","message","fields?","issues?"}}`. Treat **`error.code`** as the stable i18n key (e.g. map `iam.email_already_in_use` to nested locale keys under `errors`).
        **`message`** is an English fallback. **`fields`** lists JSON property names for form validation. **`500`** responses use `common.internal_server_error`; details are logged server-side only.
        ## Common error codes (many endpoints)
        **Bearer JWT / context (often 401):** `common.auth_header_missing`, `common.auth_header_invalid`, `common.jwt_expired`, `common.jwt_invalid`, `common.unauthorized`, `common.missing_organization_context`, `common.missing_hotel_context` (when the route requires a hotel in the JWT).
        **JSON body:** `common.request_body_required`, `common.invalid_request_payload`.
        **Path/query UUIDs:** `common.invalid_booking_id`, `common.invalid_guest_id`, `common.invalid_room_id`, `common.invalid_room_type_id`, `common.invalid_form_target` (guest/booking `GET …/form?target=`).
        **Forms:** `common.definition_required` when the FormDSL `definition` body is missing on `PUT …/form/definition`.
        Each operation below repeats the **additional** domain codes for that route; combine with the common sets above.
        In Swagger UI, each error response row uses a standard HTTP label (e.g. Unauthorized, Not Found). Domain-specific **`error.code`** values for that operation are listed in the operation **Description** under **Error codes**.
    title: QonaqDash CRM API
    version: "1.0"
openapi: 3.0.3
paths:
    /api/account:
        get:
            description: |-
                Current user account (Bearer + org context). Response includes `permissions`, sourced from the resolved authenticated actor for this request. In `settings`, JSON null means not set.
                **Error codes:** iam.user_not_found. Corrupt stored settings may yield 500.
            operationId: getAccount
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/iamhttp.AccountBundleResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/sharedhttp.ErrorResponse'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/sharedhttp.ErrorResponse'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/sharedhttp.ErrorResponse'
                    description: Internal Server Error
            security:
                - BearerAuth: []
            summary: Get account
            tags:
                - IAM - Account
        put:
            description: |-
                Partial merge of `account` and `settings`; omitted top-level keys unchanged (Bearer + org). Response includes the current request actor's `permissions`. Password change: send `currentPassword` and `newPassword`. Per-key JSON null in `settings` clears that key; unknown keys → 400.
                **Error codes:** 400 — iam.invalid_email, iam.unknown_setting_key, iam.invalid_setting_value. 401 — iam.current_password_incorrect, iam.current_password_required. 404 — iam.user_not_found. 409 — iam.email_already_in_use.
            operationId: updateAccount
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/iamhttp.UpdateAccountRequest'
                description: Partial account and settings
                required: true
                x-originalParamName: body
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/iamhttp.AccountBundleResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/sharedhttp.ErrorResponse'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/sharedhttp.ErrorResponse'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/sharedhttp.ErrorResponse'
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/sharedhttp.ErrorResponse'
                    description: Conflict
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/sharedhttp.ErrorResponse'
                    description: Internal Server Error
            security:
