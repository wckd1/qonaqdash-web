            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/bookinghttp.CreateBookingRequest'
                description: Flat guest + stay (+ optional adjustments)
                required: true
                x-originalParamName: body
            responses:
                "201":
                    content:
                        application/json:
                            schema:
