                    description: Internal Server Error
            security:
                - BearerAuth: []
            summary: List pricing rules
            tags:
                - Pricing - Rules
        post:
            description: |-
                A pricing rule combines typed conditions (property field match, specific date, date range) with an effect (percent or fixed adjustment, per-night or total scope). `priority` is a unique positive integer per hotel (lower = higher precedence). `status` defaults to `active` when omitted; only `active` and `disabled` are accepted on write. Property condition operators: `eq` (equals), `not_eq` (not equals); both use `value`. Property conditions are validated against the current booking form condition index; referencing a deleted field or removed select option is rejected.
