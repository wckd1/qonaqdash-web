            $ref: '#/definitions/sharedhttp.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sharedhttp.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/sharedhttp.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/sharedhttp.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List bookings
      tags:
      - Booking
    post:
      consumes:
      - application/json
      description: |-
        Flat `{ guest, stay, adjustments? }` JSON (see `CreateBookingRequest`). Optional top-level `adjustments` are manual pricing inputs forwarded to Pricing (not persisted on the booking stream). Room availability is checked twice before commit and the DB rejects overlapping active assignments for the same physical room, so concurrent creates (e.g. OTA + front desk) cannot double-book. `guest.id` links an existing profile; omit to create inline.
        A new inline guest (`guest` without `id`) is created as a part of the booking and needs no guest right.
        **Error codes:** booking.invalid_data_format, booking.dates_required, booking.rooms_required, booking.room_type_required_each_room, booking.form_missing_stay_group, booking.guest_information_required; booking.overbooking; **409** `guest.duplicate` when inline guest creation hits an existing profile; **422** `common.validation_failed` with `error.issues[]` when payload fails org booking form `rules` (stay subtree and array rows) or inline guest constraints (e.g. `guest.email` / `guest.phone` `validation.contact_required`).
      operationId: createBooking
      parameters:
      - description: Flat guest + stay (+ optional adjustments)
        in: body
        name: body
        required: true
