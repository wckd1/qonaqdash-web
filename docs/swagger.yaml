  /api/bookings:
    get:
      description: |-
        Distinct bookings (read model), each with its rooms under `stay.rooms[]`. Optional `q` on guest name. `from` and `to` are hotel-local dates `YYYY-MM-DD` of the period `[from, to)`: a booking is listed when it has a night in it (a night is the local date from the check-in date to the check-out date, not included). Either bound may be omitted (unbounded).
