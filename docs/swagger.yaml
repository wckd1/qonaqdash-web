  /api/property/rooms/available:
    get:
      description: |-
        Room picker: omit `check_in`/`check_out` for all rooms of the hotel, blocked ones included with their `state` (the rows of the reservation grid). With both, the moments of the stay in RFC 3339 like the booking write (`stay.check_in`, `stay.check_out`), only rooms sellable for every night of the stay. The nights are the hotel-local dates from the check-in date to the check-out date, not included: the same rule as the booking write, so a room listed here is accepted by it. A room is blocked on night *d* when another active stay holds it that night, when it is out of order, or when it is under maintenance with a planned end later than the hotel check-in hour on day *d* (without a planned end, every night). With `exclude` (booking UUID) and a stay, that booking's occupancy is ignored so its rooms stay selectable.
        Choosing a room is a part of writing a booking or creating a task: with a stay readable with `rooms.view`, `bookings.create`, `bookings.modify`, `housekeeping_tasks.create` or `maintenance_tasks.create` (owned level included). Without it the list of the hotel's rooms is also readable by every booking reader (`bookings.view`, `bookings.operate`, `bookings.cancel`): the reservation grid cannot be shown without it.
        **Error codes:** property.list_check_in_check_out_both_or_neither, property.list_invalid_check_in, property.list_invalid_check_out, property.list_check_out_before_check_in, property.list_invalid_exclude_booking_id.
      operationId: listAvailableRooms
      parameters:
      - description: Check-in moment, RFC 3339 (2026-03-15T14:00:00+05:00); required
          together with check_out
        format: date-time
        in: query
        name: check_in
        type: string
      - description: Check-out moment, RFC 3339, on a later hotel date than check_in;
          required together with check_in
        format: date-time
        in: query
        name: check_out
        type: string
      - description: Booking UUID; only with check_in+check_out — rooms occupied solely
          by this booking count as available
        format: uuid
        in: query
        name: exclude
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/propertyhttp.AvailableRoomResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sharedhttp.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sharedhttp.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/sharedhttp.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/sharedhttp.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List available rooms
      tags:
      - Property - Rooms
