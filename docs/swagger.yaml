      description: |-
        Replaces the `permission_overrides` document on the employee's primary hotel link. Effective permissions are computed as `override if present else merged occupation base`. The primary hotel link is `employee.hotel_id` when set, otherwise the first linked hotel.
        Requires `hotel.manage_permissions`.
        Levels: 0 none, 2 hotel, 3 organization for every key; 1 (owned) only for `housekeeping_tasks` and `maintenance_tasks`. Any other level is rejected with 400 `iam.invalid_permission_level`.
