          schema:
            $ref: '#/definitions/sharedhttp.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/sharedhttp.ErrorResponse'
        "422":
          description: Form rules validation failed
          schema:
            $ref: '#/definitions/sharedhttp.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/sharedhttp.ErrorResponse'
