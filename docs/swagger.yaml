        in: query
        name: from
        required: true
        type: string
      - description: Period end, hotel-local date YYYY-MM-DD, not included; after
          from
        example: '"2026-04-01"'
        format: date
        in: query
        name: to
        required: true
        type: string
      - description: Filter by entry type(s), comma-separated
        example: '"payment,refund"'
        in: query
        name: entry_type
        type: string
      - description: Page size (default 50, max 200)
        example: 50
        in: query
        name: limit
        type: integer
      - description: Offset for pagination
        example: 0
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
